{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
  /* Center the video */
  video.center {
    display: block;
    margin: 0 auto;
    border-radius: 10px;
  }

  /* Button styling */
  .button {
    background-color: #ffd966; /* yellow color */
    color: #333;
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 12px; /* rounded corners */
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: bold;
    margin-top: 20px;
  }

  .button:hover {
    background-color: #ffec99;
    transform: scale(1.05);
  }

  /* Center the button container */
  .form-style {
    text-align: center;
  }
</style>

<video width="500" height="380" class="center" autoplay loop>
  <source src="{% static 'Hello.mp4' %}" type="video/mp4">
  Your browser does not support the video tag.
</video>

<div class="form-style">
  <a href="{% url 'animation' %}">
    <button class="button">Click to Start</button>
  </a>
</div>

{% endblock %}
