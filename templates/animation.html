{% extends 'base.html' %}
{% load static %}


{% block content %}
<div class="split left panel-left">
    <h2 align="left">Enter Text or Use Mic</h2>
    <div class="input-row">
        <form action="" method="post">
		{% csrf_token %}
            <input type="text" name="sen" class="mytext" id="speechToText" placeholder="">
            <button type="button" name="button" class="mic" onclick="record()"><img src="{% static 'mic3.png' %}" height="32px" width="38px" /></button>
            <input type="submit" name="submit" class="submit" value="Submit">

        </form>
    </div>
        <table cellspacing="20px">
			<tr>
                <td class="td label">You said:</td>
                <td class="td value">{{ text }}</td>
			</tr>
			<tr>
                <td class="td label">Keywords detected:</td>
                <td class="td value">
				<ul class="td" id="list" align="center">
  					{% for word in words %}
    				<li id="{{ i }}" style="margin-right: 8px">{{ word }}</li>
  					{% endfor %}
				</ul>
			</td>
		</tr>
	</table></div>
  <div class="split right" style="text-align:left; gap: 30px;">
  <h2 align="left">Sign Language Animation</h2>

    <div>
        <button class="submit" onclick="playPause()">Play/Pause</button>

  	<video id="videoPlayer" width="600" height="350"  preload="auto" autoplay>
    	<source src="" type="video/mp4">
    Your browser does not support HTML5 video.
  	</video>
  	</div></div>

<style>
	
    /* Layout tweaks for converter - positions only (no color changes) */
    .panel-left {
        display: flex;
        flex-direction: column;
        align-items: center; /* center content horizontally */
        justify-content: flex-start; /* align content to top to prevent overflow */
        gap: 10px;
        padding: 10px 20px; /* reduced top padding to prevent overflow */
        overflow-y: auto; /* Allow vertical scrolling within the panel */
        overflow-x: hidden; /* Prevent horizontal overflow */
        max-height: calc(100vh - 80px); /* reduced height to prevent overflow */
        text-align: center; /* Center text content */
        margin-left: -170px; /* move panel 170px to the left */
    }

    .input-row {
        display: flex;
        align-items: center;
        justify-content: flex-start; /* keep inputs on the left */
        gap: 12px;
        margin: 8px 0 6px;
    }

    /* Space between input, mic and submit (make the form a flex row) */
    .panel-left form {
        display: flex;
        align-items: center;
        gap: 14px; /* spacing between text input, mic, and submit */
        margin: 0;
    }

    /* Input box */
    #speechToText {
        border-radius: 8px;
        padding: 4px 8px;    /* smaller padding */
        border: 1px solid #ccc;
        outline: none;
        width: 260px;   
        margin-left: 0; 
        color: black !important;  /* Make text black */
    }
    /* Mic button */
    .mic {
        border-radius: 8px;
        padding: 6px 10px;
        border: 1px solid #ccc;
        margin-left: 0; 
        cursor: pointer;
    }

    /* Submit button */
    .submit {
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        cursor: pointer;
    }

    /* Play/Pause button */
    button[onclick="playPause()"] {
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid #ccc;
        cursor: pointer;
    }

    /* Right panel alignment: center everything */
    .split.right {
        display: flex;
        flex-direction: column;
        align-items: center; /* center content horizontally */
        justify-content: flex-start; /* align content to top to match left panel */
        text-align: center; /* center text content */
        padding: 10px 20px; /* same padding as left panel */
        gap: 10px; /* same gap as left panel for consistent line spacing */
        margin-top: 10px; /* move panel 10px down */
    }
    
    .split.right h2 { margin: 0; }
    .split.right > div { display: flex; flex-direction: column; align-items: center; }
    .split.right > div > .submit { margin-bottom: 0; }
    #videoPlayer { display: block; margin-top: 0; }
    
    /* Ensure split panels are properly contained */
    .split.left {
        overflow: hidden; /* Prevent any overflow from extending beyond panel */
        box-sizing: border-box; /* Include padding and border in width calculation */
    }
    
    .split.right {
        overflow: hidden; /* Prevent any overflow from extending beyond panel */
        box-sizing: border-box; /* Include padding and border in width calculation */
    }
    
    /* Keywords detected list scrollbar */
    #list {
        max-height: 200px; /* Limit height of keywords list */
        overflow-y: auto; /* Enable vertical scrolling */
        overflow-x: hidden; /* Prevent horizontal scrolling */
        padding: 10px; /* Add padding inside the scrollable area */
        margin-top: 10px; /* Add margin from the label */
    }
    
    /* Style the scrollbar for the keywords list */
    #list::-webkit-scrollbar {
        width: 8px; /* Width of the scrollbar */
    }
    
    #list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1); /* Track background */
        border-radius: 4px;
    }
    
    #list::-webkit-scrollbar-thumb {
        background: #6ab0ff; /* Scrollbar thumb color */
        border-radius: 4px;
    }
    
    #list::-webkit-scrollbar-thumb:hover {
        background: #8fd0ff; /* Hover color */
    }
</style>

<script>
	//webkitSpeechRecognition api for speech to text conversion
	function record(){
		var recognition = new webkitSpeechRecognition();
		recognition.lang='en-IN';

		recognition.onresult = function(event){
			console.log(event)
			document.getElementById('speechToText').value = event.results[0][0].transcript;
		}
		recognition.start();
	 }
	function play()
	{
		var videoSource = new Array();
		var	videos = document.getElementById("list").getElementsByTagName("li");
		var j;
		for(j=0;j<videos.length;j++)
		{
			videoSource[j] = "/static/" + videos[j].innerHTML +".mp4";
		}

		var i = 0; // define i
		var videoCount = videoSource.length;

		function videoPlay(videoNum)
		{
            var currentLi = document.getElementById("list").getElementsByTagName("li")[videoNum];
            var videoPlayer = document.getElementById("videoPlayer");
            
            currentLi.style.color = "var(--text-highlight)";
			currentLi.style.fontSize = "xx-large";
			
			// Auto-scroll to the current item
			currentLi.scrollIntoView({ 
				behavior: 'smooth', 
				block: 'center',
				inline: 'nearest'
			});
			
			// Quick transition without gaps
			videoPlayer.style.transition = 'opacity 0.1s ease-in-out';
			videoPlayer.style.opacity = '0.9';
			
			// Very short delay to minimize gaps
			setTimeout(function() {
				videoPlayer.setAttribute("src", videoSource[videoNum]);
				videoPlayer.load();
				
				// Quick fade back in
				videoPlayer.addEventListener('canplay', function() {
					videoPlayer.play();
					videoPlayer.style.opacity = '1';
					videoPlayer.removeEventListener('canplay', arguments.callee);
				}, { once: true });
			}, 50);
		}
		document.getElementById('videoPlayer').addEventListener('ended', myHandler, false);
        document.getElementById("list").getElementsByTagName("li")[0].style.color = "var(--text-highlight)";
		document.getElementById("list").getElementsByTagName("li")[0].style.fontSize = "xx-large";

		videoPlay(0); // play the video

		function myHandler()
		{
            document.getElementById("list").getElementsByTagName("li")[i].style.color = "var(--text-body)";
			document.getElementById("list").getElementsByTagName("li")[i].style.fontSize = "20px";
			i++;
	    	if (i == videoCount)
	    	{
	       	    document.getElementById("videoPlayer").pause();
	    	}
	     	else
	     	{
	        	videoPlay(i);
	    	}
		}
	}
	/* LETS USE ONLY PLAY PAUSE BUTTON WITH 720 *420 ,IT FITS THE SCREEN
	function makeBig() {
	    document.getElementById("videoPlayer").width = 560;
		document.getElementById("videoPlayer").height = 360;
	}

	function makeSmall() {
	    document.getElementById("videoPlayer").width = 320;
		document.getElementById("videoPlayer").height = 180;
	}

	function makeNormal() {
	    document.getElementById("videoPlayer").width = 420;
		document.getElementById("videoPlayer").height =280;
	}*/
	function playPause(){
  		if (document.getElementById("videoPlayer").paused){
    		play();}
  		else{
    		document.getElementById("videoPlayer").pause();}
		}

	</script>


{% endblock %}
