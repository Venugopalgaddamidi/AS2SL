{% extends 'base.html' %}

{% block content %}
<div style="
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    padding-top: 20px;
    overflow: inherit;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
">
    <div style="
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 50px 40px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        width: 350px;
        text-align: center;
        color: #fff;
    ">
        <h1 style="margin-bottom: 15px; font-weight: 600; letter-spacing: 1px;">Sign Up</h1>
        <form action="." method="post" style="display: flex; flex-direction: column; gap: 2px; align-items: stretch;">
    {% csrf_token %}
    {{ form }}
    <input class="submit" type="submit" value="Sign Up" style="
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.3s ease;
    "
    onmouseover="this.style.background='rgba(255,255,255,0.4)';"
    onmouseout="this.style.background='rgba(255,255,255,0.2)';">
</form>

        <p style="margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.8);">
            Already have an account? <a href="{% url 'login' %}" style="color: #fff; text-decoration: underline;">Log in</a>
        </p>
    </div>
</div>

<style>
    /* Make all form fields and submit button full width */
    form input,
    form select,
    form textarea {
        width: 100% !important;
        box-sizing: border-box;
    }

    form input[type="submit"] {
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: 0.3s ease;
    }

    form input[type="submit"]:hover {
        background: rgba(255,255,255,0.4);
    }

    form input[type="text"],
    form input[type="password"],
    form input[type="email"] {
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
        outline: none;
        transition: 0.3s ease;
    }

    form input[type="text"]:focus,
    form input[type="password"]:focus,
    form input[type="email"]:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255,255,255,0.6);
    }

    form label {
        display: block;
        text-align: left;
        font-size: 14px;
        color: rgba(255,255,255,0.8);
        margin-bottom: 2px;
        font-weight: 500;
    }

    ::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }
    .helptext {
        display: none;
    }
</style>

<script type="text/javascript">
    document.getElementsByTagName("span")[0].innerHTML="";
    document.getElementsByTagName("span")[1].innerHTML="";
</script>
{% endblock %}
